[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift"
version = "3.1.0"
description = "Evidence-aware crop rotation decision support engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
  "httpx>=0.27,<1",
]

[project.scripts]
fieldshift-v3 = "fieldshift.v3.cli:main"
fieldshift-api = "fieldshift.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fieldshift.api" = ["static/*"]

[tool.ruff]
line-length = 120
exclude = ["src/fieldshift/v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "src/fieldshift/v2"
